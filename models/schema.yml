version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have one row per product_id found within each orders_id
        loaded_at_field: date_date
        freshness:
          warn_after:
            count: 90
            period: day

        columns:
          - name: date_date
            description: Date of purchase
          - name: orders_id
            description: Unique identifier for the order
          - name: pdt_id
            description: Unique identifier for the product
          - name: revenue
            description: Revenue generated by each product
          - name: quantity
            description: Quantity of product sold
        tests:
          - unique:
              column_name: "(orders_id || '_' || pdt_id)"
          - not_null:
              column_name: "(orders_id || '_' || pdt_id)"
      - name: product
        identifier: raw_gz_product
        description: products of Greenweez with corresponding purchase price / we have one row per product_id
        columns:
          - name: products_id
            description: Unique identifier for the product
            tests:
              - not_null
              - unique
          - name: purchSE_PRICE
            description: Cost at which the product was acquired before any markup or discount
      - name: ship
        identifier: raw_gz_ship
        description: table containing order-level logistics and cost information for Greenweez
        columns:
          - name: orders_id
            description: Unique identifier for the order
            tests:
              - not_null
              - unique
          - name: shipping_fee
            description: Fee charged to the customer for shipping
          - name: logCost
            description: Internal logistics cost incurred to fulfill the order
          - name: ship_cost
            description: Shipping cost incurred to ship the order